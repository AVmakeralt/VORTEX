[package]
name = "vortex-jit"
version = "0.5.4"
edition = "2021"
description = "Rust bindings for the VORTEX JIT compiler — a profile-guided optimizing JIT with float arithmetic, input-shape-keyed profiles, phase partitioning, ensemble aggregation, T1 code persistence, and append-only crash-safe profile patching."
license = "MIT"
repository = "https://github.com/AVmakeralt/VORTEX"
keywords = ["jit", "compiler", "pgo", "bytecode", "vm"]
categories = ["compilers", "api-bindings"]
include = ["Cargo.toml", "build.rs", "wrapper.h", "src/**", "../src/**", "../build/vortex_config.h"]

[lib]
name = "vortex"
crate-type = ["rlib", "cdylib"]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1.0"

[build-dependencies.bindgen]
version = "0.69"
optional = true

[features]
default = []
runtime-bindgen = ["bindgen"]
sota = []
assertions = []
verify = []
