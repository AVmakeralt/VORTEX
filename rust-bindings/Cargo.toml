[package]
name = "vortex-jit"
version = "0.13.6"
edition = "2021"
description = "Rust bindings for the VORTEX JIT compiler — multi-tier JIT with AOT background compilation, trace-based PGO with re-tracing, retargetable regalloc (x86-64/ARM64/RISC-V), float arithmetic, and dynamic objects with prototype chains."
license = "MIT"
repository = "https://github.com/AVmakeralt/VORTEX"
keywords = ["jit", "compiler", "pgo", "bytecode", "vm"]
categories = ["compilers", "api-bindings"]
include = ["Cargo.toml", "build.rs", "wrapper.h", "src/**", "vendor/**"]

[lib]
name = "vortex"
crate-type = ["rlib", "cdylib"]

[dependencies]
libc = "0.2"

[build-dependencies]
cc = "1.0"

[build-dependencies.bindgen]
version = "0.69"
optional = true

[features]
default = []
runtime-bindgen = ["bindgen"]
sota = []
assertions = []
verify = []
